# Build the Eleventy site from src/ and publish the output (_site/) to the
# gh-pages branch — so src/ becomes the single source of truth.
#
# ONE-TIME SETUP:
#   1. GitHub → Settings → Pages → "Build and deployment" → Source:
#      "Deploy from a branch" → Branch: gh-pages / (root)
#   2. If the custom domain was previously set on another branch, re-verify
#      it under Settings → Pages → "Custom domain".
#      (This workflow writes the CNAME file into the gh-pages branch itself.)

name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Deploy _site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          cname: onlinepdfpro.com
