# Build the Eleventy site from src/ and publish the output (_site/) to the
# gh-pages branch — so src/ becomes the single source of truth.
#
# ONE-TIME SETUP:
#   1. GitHub → Settings → Pages → "Build and deployment" → Source:
#      "Deploy from a branch" → Branch: gh-pages / (root)
#   2. If the custom domain was previously set on another branch, re-verify
#      it under Settings → Pages → "Custom domain".
#      (This workflow writes the CNAME file into the gh-pages branch itself.)

name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: onlinepdfpro-production-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # The Worker is a production dependency of the frontend. Validate both
  # surfaces on every main push and make the frontend wait for a successful
  # Worker deployment so an API/frontend mismatch cannot ship silently.
  validate-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Check static performance budget
        run: npm run perf:budget

      - name: Run regression suite
        run: npm test

      - name: Validate Worker syntax and configuration
        shell: bash
        run: |
          node --input-type=module --check < cf-worker/pdf-api-proxy.js
          npx --yes wrangler@4.36.0 deploy --dry-run --config cf-worker/wrangler.toml --outdir /tmp/onlinepdfpro-worker-dry-run

      - name: Check Cloudflare deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "Cloudflare GitHub secrets are required; refusing to skip Worker deployment." >&2
            exit 1
          fi

      - name: Check required Worker runtime secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          secret_list="$(npx --yes wrangler@4.36.0 secret list --config cf-worker/wrangler.toml)"
          required=(GROQ_API_KEY OPENROUTER_API_KEY RAZORPAY_KEY_ID RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY TURNSTILE_SECRET_KEY CONVERSION_SIGNING_SECRET MODAL_API_TOKEN)
          for name in "${required[@]}"; do
            if ! grep -q "\"name\": \"$name\"" <<<"$secret_list"; then
              echo "Missing required Cloudflare Worker secret: $name" >&2
              exit 1
            fi
          done

  deploy-worker:
    needs: validate-worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cf-worker
          command: deploy

  smoke-worker:
    needs: deploy-worker
    runs-on: ubuntu-latest
    steps:
      - name: Check health and defensive routes
        shell: bash
        run: |
          set -euo pipefail
          API="https://onlinepdfpro-proxy.prem736raj.workers.dev"
          health="$(curl --fail --silent --show-error "$API/health")"
          echo "$health" | grep -q '"status":"ok"'

          unknown_code="$(curl --silent --output /tmp/onlinepdfpro-unknown.json --write-out '%{http_code}' "$API/not-a-real-route")"
          test "$unknown_code" = "404"

          ai_code="$(curl --silent --output /tmp/onlinepdfpro-ai.json --write-out '%{http_code}' \
            -X POST "$API/ai/chat" \
            -H 'Origin: https://onlinepdfpro.com' \
            -H 'Content-Type: application/json' \
            --data '{}')"
          test "$ai_code" = "403"

          cors_headers="$(curl --silent --dump-header - --output /dev/null \
            -H 'Origin: https://not-onlinepdfpro.example' "$API/health")"
          ! echo "$cors_headers" | grep -qi '^access-control-allow-origin:'

  build-and-deploy:
    needs: smoke-worker
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy _site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          cname: onlinepdfpro.com
