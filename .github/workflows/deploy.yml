# Publish the built artifact to the existing Cloudflare Pages project.
# Disable Pages' automatic production deployments before enabling this workflow
# so a main push cannot publish the stale repository root ahead of the API gate.

name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: onlinepdfpro-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The Worker is a production dependency of the frontend. Validate both
  # surfaces on every main push and make the frontend wait for a successful
  # Worker deployment so an API/frontend mismatch cannot ship silently.
  validate-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Check static performance budget
        run: npm run perf:budget

      - name: Run regression suite
        run: npm test

      - name: Validate conversion service source
        run: python -m compileall -q services

      - name: Validate Worker syntax and configuration
        shell: bash
        run: |
          node --input-type=module --check < cf-worker/pdf-api-proxy.js
          npx --yes wrangler@4.36.0 deploy --dry-run --config cf-worker/wrangler.toml --outdir /tmp/onlinepdfpro-worker-dry-run

      - name: Check Cloudflare deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Production publication requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Configure repository Actions secrets before retrying."
            exit 1
          fi

      - name: Check required Worker runtime secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          secret_list="$(npx --yes wrangler@4.36.0 secret list --config cf-worker/wrangler.toml)"
          required=(GROQ_API_KEY OPENROUTER_API_KEY RAZORPAY_KEY_ID RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY TURNSTILE_SECRET_KEY CONVERSION_SIGNING_SECRET MODAL_API_TOKEN)
          for name in "${required[@]}"; do
            if ! grep -q "\"name\": \"$name\"" <<<"$secret_list"; then
              echo "Missing required Cloudflare Worker secret: $name" >&2
              exit 1
            fi
          done

  deploy-worker:
    needs: validate-worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cf-worker
          wranglerVersion: "4.36.0"
          command: deploy --var RELEASE_ID:${{ github.sha }}

  smoke-worker:
    needs: deploy-worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0

      - name: Check health and defensive routes
        run: node scripts/smoke-worker.mjs --release "$GITHUB_SHA"

  build-and-deploy:
    needs: [validate-worker, smoke-worker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Verify frontend release attribution
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./_site/release.json').release")" = "$GITHUB_SHA"

      - name: Publish verified artifact to Cloudflare Pages
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name onlinepdfpro --branch main --commit-hash ${{ github.sha }}
          wranglerVersion: "4.36.0"

      - name: Verify public frontend release
        run: node scripts/smoke-site.mjs --release "$GITHUB_SHA"
