name: Validate changes
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and validate
        run: |
          npm run build
          npm test
          npm run test:watchers
          npm run perf:budget
          npm audit
      - name: Validate conversion service source
        run: python -m compileall -q services
      - name: Validate Worker configuration
        run: |
          node --input-type=module --check < cf-worker/pdf-api-proxy.js
          npx --yes wrangler@4.147.0 deploy --dry-run --config cf-worker/wrangler.toml --outdir /tmp/onlinepdfpro-worker-dry-run
