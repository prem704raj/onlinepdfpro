version: "3.9"

services:
  docx2pdf:
    build: ./services/docx2pdf
    ports:
      - "8001:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G

  gateway:
    build: ./services/gateway
    ports:
      - "8080:8000"
    restart: unless-stopped
    env_file: .env
    environment:
      - DOCX2PDF_URL=http://docx2pdf:8000
    depends_on:
      docx2pdf:
        condition: service_healthy
