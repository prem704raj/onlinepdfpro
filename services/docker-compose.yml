version: "3.9"

services:
  docx2pdf:
    build: ./docx2pdf
    # Keep the LibreOffice service on the private compose network; only the
    # authenticated gateway is published to the host.
    expose:
      - "8000"
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G

  gateway:
    build: ./gateway
    ports:
      - "8080:8000"
    restart: unless-stopped
    env_file: .env
    environment:
      - DOCX2PDF_URL=http://docx2pdf:8000
    depends_on:
      docx2pdf:
        condition: service_healthy
